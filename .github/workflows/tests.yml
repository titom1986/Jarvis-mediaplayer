name: Tests
on:
  push:
    branches:
      - feature/generic-media-discovery
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - run: python -m py_compile agent.py tools/*.py tests/*.py
      - run: python -m unittest discover -s tests -v
